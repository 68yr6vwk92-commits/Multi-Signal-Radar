
name: Build Multi-Signal Radar IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project MultiSignalRadar.xcodeproj \
            -scheme MultiSignalRadar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MultiSignalRadar.app Payload/
          zip -r MultiSignalRadar.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MultiSignalRadar-IPA
          path: MultiSignalRadar.ipa
